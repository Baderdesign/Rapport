    - cron: '17 6 */3 * *'   # alle 3 Tage um ca. 07:17 Uhr
  workflow_dispatch:          # zum manuellen Testen

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable__xkyel0dLhmo7FzJVeUA0w_Mt2N_HCL" \
            "https://ygseeslxgfvokudcooyb.supabase.co/rest/v1/sites?select=nr&limit=1")
          echo "Antwort: $code"
          test "$code" -lt 500
